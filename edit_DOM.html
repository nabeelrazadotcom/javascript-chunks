<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editing element in DOM</title>
</head>
<body style="background-color: #212121; color: #fff">
    <ul class="courses">
        <li>Basic Computing</li>
    </ul>
</body>
<script>

    function addCourse(courseName) {
        let course = document.createElement('li')
        course.appendChild(document.createTextNode(courseName))
        document.querySelector('.courses').appendChild(course)
    }

    addCourse('English Spoken')
    addCourse('Drone Operating')
    addCourse('MS Office')

    // edit
    let secondCourse = document.querySelector('li:nth-child(2)')
    let newcourse = document.createElement('li')
    newcourse.textContent = 'Touch Typing'

    secondCourse.replaceWith(newcourse)

    let firstCouse = document.querySelector('li:first-child')
    firstCouse.outerHTML = '<li>Time Management</li>'

    // remove
    let thirdCourse = document.querySelector('li:nth-child(3)')
    thirdCourse.remove()


</script>

</html>
