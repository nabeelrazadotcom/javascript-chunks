<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- decorative blobs -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="card">

    <!-- HEADER -->
    <div class="card-header">
      <div class="header-left">
        <h1>My Tasks</h1>
        <span id="count"></span>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-f="all">All</button>
        <button class="filter-btn" data-f="active">Active</button>
        <button class="filter-btn" data-f="done">Done</button>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="Add a new task…" autocomplete="off"/>
      <button id="add-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- LIST -->
    <ul id="todo-list"></ul>

    <!-- EMPTY STATE -->
    <div id="empty-state" class="empty-state hidden">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
      <p>All clear! Add a task above.</p>
    </div>

    <!-- FOOTER -->
    <div class="card-footer">
      <button id="clear-btn">Clear completed</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
