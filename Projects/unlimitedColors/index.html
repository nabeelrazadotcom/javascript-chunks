<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Number Guessing Game</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <link rel="stylesheet" href="../style.css" />
  </head>
  <body style="background-color: #212121; color: #fff">
    <nav>
      <a href="/" aria-current="page">Home</a>
      <a target="_blank" href="https://www.youtube.com/@chaiaurcode"
        >Youtube channel</a
      >
    </nav>
    <div class="container d-flex flex-column mt-4">
      <h1 class="text-center">
        Start should change the Background color every second
      </h1>
      <div
        class="btn-group-vertical gap-2 mt-5"
        role="group"
        aria-label="Vertical button group"
      >
        <button id="start" type="button" class="btn btn-outline-success fw-bolder fs-2">Start</button>
        <button id="stop" type="button" class="btn fw-bold fs-3 btn-outline-danger">Stop</button>
      </div>
      
    </div>
    <script src="script.js"></script>
  </body>
</html>
