<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Number Guessing Game</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="game-page">
    <nav class="navbar bg-dark px-3 py-3 mb-3 game-nav">
      <a
        class="text-decoration-none text-light border rounded-5 px-3 py-1 d-flex gap-2 align-items-center"
        href="/"
        aria-current="page"
      >
        <i class="bi bi-house-fill"></i> Home
      </a>
      <a
        class="text-decoration-none text-light border rounded-5 px-3 py-1 d-flex gap-2 align-items-center"
        target="_blank"
        href="https://www.youtube.com/@chaiaurcode"
        ><i class="bi bi-youtube"></i>Youtube channel</a
      >
    </nav>

    <main class="game-shell">
      <section
        id="wrapper"
        class="card d-flex flex-column px-4 py-4 gap-3"
        aria-labelledby="game-title"
      >
        <div class="header d-flex flex-column gap-2">
          <p class="eyebrow m-0 text-center">Arcade challenge</p>
          <h1 id="game-title" class="m-0 text-center main-heading">Number Guessing Game</h1>
          <p class="header-copy m-0 text-center">
            I have a number between 1 and 100 in my head. Try your best to guess it in
            10 attempts.
          </p>
        </div>

        <!-- <div class="status-strip" aria-label="Game instructions">
          <p class="m-0">
            Enter a whole number from <strong>1 to 100</strong> and use each hint to
            move <strong>higher</strong> or <strong>lower</strong>.
          </p>
        </div> -->

        <form class="form d-flex flex-column gap-3">
          <label for="guessField" id="guess">Make your guess</label>
          <input
            type="number"
            id="guessField"
            placeholder="Enter a number from 1 to 100"
            class="guessField"
            inputmode="numeric"
            min="1"
            max="100"
            autocomplete="off"
          />
          <input
            type="submit"
            id="subt"
            value="Submit Guess"
            class="guessSubmit btn btn-primary"
          />
        </form>

        <div class="resultParas d-flex flex-column gap-2">
          <div class="stat-row">
            <h2 class="stat-label m-0">Previous Guesses</h2>
            <p class="stat-value guesses m-0">None yet</p>
          </div>
          <div class="stat-row">
            <h2 class="stat-label m-0">Remaining Attempts</h2>
            <p class="stat-value lastResult m-0">10</p>
          </div>
          <p class="lowOrHi m-0" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
