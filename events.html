<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #222;
        font-family: "helvetica";
        color: #2f2f;
      }

      .main {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .btn {
        width: 150px;
        height: 50px;
        border-radius: 50px;
        background-color: darkcyan;
        color: #ffffff;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }

      .btn:hover {
        background-color: rgb(0, 108, 108);
        color: #d0d0d0;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <input type="file" hidden name="file" class="file"/>
      <button class="btn">Upload File</button>
    </div>


    <script>

        let fileInp = document.querySelector('.file');
        let btn = document.querySelector('.btn');

        btn.addEventListener("click", function(){
            fileInp.click();
        })

        fileInp.addEventListener("input", function(e){
            let fileName = (e.target.files[0].name);
            btn.textContent = fileName;
        })


    </script>
  </body>
</html>
